name: AutoAssistantWorkerBot

on:
  workflow_dispatch:
    inputs:
      smoke_test:
        description: "Run a safe public example.com Playwright smoke test instead of configured targets"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: auto-assistant-worker
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secret injection (presence only)
        env:
          AUTO_ASSISTANT_BOT_TOKEN: ${{ secrets.AUTO_ASSISTANT_BOT_TOKEN }}
          AUTO_ASSISTANT_CHAT_ID: ${{ secrets.AUTO_ASSISTANT_CHAT_ID }}
          AUTO_ASSISTANT_GEMINI_API_KEY: ${{ secrets.AUTO_ASSISTANT_GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in AUTO_ASSISTANT_BOT_TOKEN AUTO_ASSISTANT_CHAT_ID AUTO_ASSISTANT_GEMINI_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required repository secret is missing or empty: ${name}"
              missing=1
            else
              echo "Secret injection present: ${name}"
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run JSON-first automation
        env:
          AUTO_ASSISTANT_BOT_TOKEN: ${{ secrets.AUTO_ASSISTANT_BOT_TOKEN }}
          AUTO_ASSISTANT_CHAT_ID: ${{ secrets.AUTO_ASSISTANT_CHAT_ID }}
          AUTO_ASSISTANT_GEMINI_API_KEY: ${{ secrets.AUTO_ASSISTANT_GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AUTO_ASSISTANT_SMOKE_TEST: ${{ inputs.smoke_test || false }}
        run: python scripts/main.py

      # Stage only intended generated state and retry pushes after rebasing on main.
      - name: Commit and push generated state with retry
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- memory/*.json input/targets.json
          if git diff --cached --quiet; then
            echo "No generated state changes to commit."
            exit 0
          fi

          git commit -m "chore: update automation memory [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Generated state pushed successfully on attempt ${attempt}."
              exit 0
            fi

            echo "Push attempt ${attempt} was rejected; fetching latest main."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Could not rebase generated state cleanly onto origin/main."
              exit 1
            fi
          done

          echo "::error::Push failed after 5 attempts."
          exit 1
