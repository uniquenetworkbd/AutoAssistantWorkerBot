name: Auto Assistant Worker Bot

on:
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Run in smoke test mode'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run JSON-first automation
        env:
          AUTO_ASSISTANT_BOT_TOKEN: ${{ secrets.AUTO_ASSISTANT_BOT_TOKEN }}
          AUTO_ASSISTANT_CHAT_ID: ${{ secrets.AUTO_ASSISTANT_CHAT_ID }}
          AUTO_ASSISTANT_GEMINI_API_KEY: ${{ secrets.AUTO_ASSISTANT_GEMINI_API_KEY }}
          AUTO_ASSISTANT_SMOKE_TEST: ${{ inputs.smoke_test || false }}
        run: python scripts/main.py

      - name: Safe Git Commit and Push
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add memory/*.json input/targets.json || true
          git diff --staged --quiet || git commit -m "chore: update automation memory [skip ci]"
          git push origin main || true
