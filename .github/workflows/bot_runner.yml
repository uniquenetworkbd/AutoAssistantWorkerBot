name: AutoAssistantWorkerBot

on:
  workflow_dispatch:
    inputs:
      smoke_test:
        description: "Run a safe public example.com Playwright smoke test instead of configured targets"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: auto-assistant-worker
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run JSON-first automation
        env:
          AUTO_ASSISTANT_BOT_TOKEN: ${{ secrets.AUTO_ASSISTANT_BOT_TOKEN }}
          AUTO_ASSISTANT_CHAT_ID: ${{ secrets.AUTO_ASSISTANT_CHAT_ID }}
          AUTO_ASSISTANT_GEMINI_API_KEY: ${{ secrets.AUTO_ASSISTANT_GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AUTO_ASSISTANT_SMOKE_TEST: ${{ inputs.smoke_test || false }}
        run: python scripts/main.py

      - name: Rebase workspace onto latest main before auto-commit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Stash only when this run actually has workspace changes.
          stash_ref=""
          if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git stash push --include-untracked --message "workflow-generated-changes-before-rebase"
            stash_ref="$(git rev-parse -q --verify refs/stash || true)"
          fi
          git fetch origin main
          git rebase origin/main
          # Restore this run's stash only; never pop an unrelated older stash.
          if [ -n "$stash_ref" ] && [ "$(git rev-parse -q --verify refs/stash || true)" = "$stash_ref" ]; then
            git stash pop "$stash_ref"
          fi

      - name: Commit learned memory and target configuration
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update automation memory [skip ci]"
          file_pattern: "memory/*.json input/targets.json"
          branch: main
          skip_dirty_check: false
