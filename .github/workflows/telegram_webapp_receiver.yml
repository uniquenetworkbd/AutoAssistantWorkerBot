name: Telegram WebApp Receiver

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autoassistant-webapp-receiver
  cancel-in-progress: false

jobs:
  receive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Receive and process Telegram WebApp submissions
        env:
          AUTO_ASSISTANT_BOT_TOKEN: ${{ secrets.AUTO_ASSISTANT_BOT_TOKEN }}
          AutoAssistantWorkerBotAdmin: ${{ secrets.AutoAssistantWorkerBotAdmin }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/telegram_webapp_handler.py

      - name: Persist Telegram update cursor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git rebase origin/main
          if git diff --quiet -- memory/webapp_state.json; then
            echo "No receiver state change."
            exit 0
          fi
          git add memory/webapp_state.json
          git commit -m "chore: persist Telegram WebApp update cursor"
          git push origin main
